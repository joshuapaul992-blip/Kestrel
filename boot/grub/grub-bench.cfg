# boot/grub/grub-bench.cfg -- the benchmark stick's entries, put at the
# bottom of grub-usb.cfg's menu by make usbimg BENCH_LINUX=<dir>. Both run
# /bin/kestrel-bench from the same root volume and write its results to the
# KESTREL RPT volume; neither loads a GPU driver (Kestrel: basic display;
# Linux: no modules but the stick's), as Xvfb needs none.
menuentry "Benchmark: Kestrel" {
    multiboot2 $kernel kestrel.root=usb kestrel.bootmgr=0 linuxkpi.drm=0 kestrel.exec=/bin/sh,/bin/kestrel-bench
    boot
}

menuentry "Benchmark: Linux (Ubuntu 24.04's kernel)" {
    linux ($esp)/boot/linux/vmlinuz console=tty0 loglevel=4
    initrd ($esp)/boot/linux/initrd.gz
    boot
}

