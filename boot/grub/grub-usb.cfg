# boot/grub/grub-usb.cfg -- configuration embedded in the memdisk of
# the USB stick's core.img. The kernel then finds the stick again
# on its own (xHCI + mass storage) and mounts its Kestrel volume on /boot.

# The desktop (X server, then LXDE or IceWM via /boot/bin/startx; the text
# terminals stay underneath) and the text console only, each also with the
# basic display (the firmware's frame buffer, no Linux display drivers).
# A kestrel.exec= baked in with KERNEL_CMDLINE comes first and wins over startx.
set timeout=5
set default=@GRUB_DEFAULT@

# The same memdisk is used by the BIOS core.img and by EFI/BOOT/BOOTX64.EFI.
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
fi
insmod multiboot2

# The kernel: on the stick's EFI System Partition (found by its FAT serial,
# unique to each build), or in the memdisk of a stick made without mtools.
if [ -f (memdisk)/boot/kernel.elf ]; then
    set kernel=(memdisk)/boot/kernel.elf
else
    search --no-floppy --fs-uuid --set=esp @ESP_UUID@
    set kernel=($esp)/boot/kernel.elf
fi

menuentry "Kestrel x86_64 - desktop (X11)" {
    multiboot2 $kernel kestrel.root=usb @KERNEL_CMDLINE@ kestrel.exec=/bin/startx
    boot
}

menuentry "Kestrel x86_64 - text console" {
    multiboot2 $kernel kestrel.root=usb @KERNEL_CMDLINE@
    boot
}

# The Linux display drivers built in through the Linux KPI (nouveau for
# NVIDIA cards, bochs for QEMU) drive the screens by default, the boot screen
# included. linuxkpi.drm=0: the basic display, the firmware's frame buffer
# only, where the panic screen really switches to 800x600 (BIOS boot).
menuentry "Kestrel x86_64 - desktop, basic display" {
    multiboot2 $kernel kestrel.root=usb @KERNEL_CMDLINE@ linuxkpi.drm=0 kestrel.exec=/bin/startx
    boot
}

menuentry "Kestrel x86_64 - text console, basic display" {
    multiboot2 $kernel kestrel.root=usb @KERNEL_CMDLINE@ linuxkpi.drm=0
    boot
}

# The GPU self-test (rootfs/bin/kestrel-selftest): checks the display and
# OpenGL step by step and writes RESULTS.TAR and REPORT.TXT to the stick's
# report volume, then leaves the desktop up. A test stick starts it by
# itself (make usbimg GRUB_DEFAULT=4).
menuentry "Kestrel x86_64 - GPU self-test (writes RESULTS.TAR to the stick)" {
    multiboot2 $kernel kestrel.root=usb @KERNEL_CMDLINE@ kestrel.bootmgr=0 kestrel.exec=/bin/sh,/bin/kestrel-selftest
    boot
}

# The benchmark stick (make usbimg BENCH_LINUX=...) adds its entries here
@BENCH_ENTRIES@
