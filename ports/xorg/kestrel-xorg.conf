# Xorg on a DRM device (startx): the modesetting driver on /dev/dri/card0,
# keyboard and mouse from /dev/input (Kestrel has no udev to find them).
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "gpu"
    Driver     "modesetting"
    Option     "kmsdev" "/dev/dri/card0"
EndSection

Section "InputDevice"
    Identifier "keyboard"
    Driver     "evdev"
    Option     "Device" "/dev/input/event0"
    Option     "CoreKeyboard"
EndSection

Section "InputDevice"
    Identifier "mouse"
    Driver     "evdev"
    Option     "Device" "/dev/input/event1"
    Option     "CorePointer"
EndSection

Section "ServerLayout"
    Identifier  "kestrel"
    Screen      "screen"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "mouse" "CorePointer"
EndSection

Section "Screen"
    Identifier "screen"
    Device     "gpu"
EndSection
