# Build check for pushes to main and pull requests: the kernel, with and
# without nouveau, the Multiboot2 header and the host unit tests. The full
# images are release.yml's job.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the build packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential nasm grub-pc-bin grub-common python3

      - name: Kernel
        run: make -j"$(nproc)"

      - name: Multiboot2 header
        run: make check

      - name: Unit tests
        run: make test

      - name: Kernel with nouveau
        run: make -j"$(nproc)" LKPI_NOUVEAU=1
